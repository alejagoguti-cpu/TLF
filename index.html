<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hotel La Fontana · Unicentro</title>
<meta name="description" content="Modelo 3D navegable del entorno del Hotel Estelar La Fontana y Unicentro, Bogotá">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/Cesium.js"></script>
<script src="config.js"></script>
<style>
  :root{--fg:#fff;--muted:rgba(255,255,255,.74);--glass:rgba(16,20,24,.5);--line:rgba(255,255,255,.18);--accent:#e9b94a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0d1013;color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #map{position:fixed;inset:0}
  .cesium-viewer-bottom{display:none}
  .glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}
  header{position:fixed;top:16px;left:16px;padding:12px 16px;max-width:calc(100% - 100px)}
  header h1{font-size:17px;font-weight:700;letter-spacing:.2px}
  header p{font-size:12.5px;color:var(--muted);margin-top:2px}
  #tools{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px}
  #tools button{width:44px;height:44px;display:grid;place-items:center;color:var(--fg);cursor:pointer}
  #tools button.on{background:rgba(233,185,74,.85);color:#16130b}
  #tools svg{width:22px;height:22px}
  #compass svg{transition:transform .05s linear}
  #bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;max-width:calc(100% - 32px);overflow-x:auto}
  #bar button{background:transparent;border:0;color:var(--fg);font:600 13px Inter,sans-serif;padding:9px 13px;border-radius:9px;cursor:pointer;white-space:nowrap}
  #bar button:hover{background:rgba(255,255,255,.1)}
  #bar button.on{background:rgba(255,255,255,.2)}
  #hint{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);font-size:12.5px;color:var(--muted);padding:8px 13px;transition:opacity .6s;white-space:nowrap}
  #pins .pin{position:fixed;transform:translate(-50%,-100%);pointer-events:none;transition:opacity .2s}
  #pins .pin span{display:block;padding:6px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;border-radius:9px}
  #pins .pin i{display:block;width:2px;height:34px;margin:0 auto;background:linear-gradient(var(--accent),transparent)}
  #pins .pin.main span{background:var(--accent);color:#16130b}
  #loader{position:fixed;inset:0;display:grid;place-items:center;background:#0d1013;z-index:9;transition:opacity .8s}
  #loader .box{width:min(320px,80vw);text-align:center}
  #loader .track{height:3px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:14px;overflow:hidden}
  #loader .fill{height:100%;width:0;background:var(--accent);transition:width .3s}
  #loader small{display:block;margin-top:10px;color:var(--muted);font-size:12px}
  #warn{position:fixed;top:84px;left:16px;max-width:min(420px,calc(100% - 32px));font-size:12.5px;padding:10px 13px;color:#ffe2a8;display:none}
  @media (max-width:560px){header h1{font-size:15px}#bar button{padding:8px 9px;font-size:12px}#hint{font-size:11.5px}}
</style>
</head>
<body>
<div id="map"></div>
<div id="pins"></div>
<header class="glass"><h1>Hotel La Fontana · Unicentro</h1><p>Calle 127 · Bogotá D.C.</p></header>
<div id="tools">
  <button id="compass" class="glass" title="Mirar al norte"><svg viewBox="0 0 40 40"><path d="M20 3l6 17h-12z" fill="#e9564a"/><path d="M20 37l-6-17h12z" fill="#fff"/></svg></button>
  <button id="orbit" class="glass" title="Girar alrededor del hotel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
  <button id="sun" class="glass" title="Sombras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</div>
<div id="hint" class="glass">Arrastra para moverte · Ctrl/clic derecho + arrastrar para pivotear · rueda para acercar</div>
<div id="warn" class="glass"></div>
<nav id="bar" class="glass"></nav>
<div id="loader"><div class="box"><b>Cargando modelo 3D</b><div class="track"><div class="fill" id="fill"></div></div><small id="pct">Preparando escena</small></div></div>

<script>
(async () => {
  const C = Cesium, cfg = window.TLF_CONFIG || {};
  const step = (p, t) => { document.getElementById('fill').style.width = p + '%'; document.getElementById('pct').textContent = t; };
  const geo = await (await fetch('geo.json')).json();
  const google = !!(cfg.googleMapsKey || cfg.cesiumIonToken);
  if (cfg.cesiumIonToken) C.Ion.defaultAccessToken = cfg.cesiumIonToken;

  const viewer = new C.Viewer('map', {
    animation: false, timeline: false, baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
    navigationHelpButton: false, fullscreenButton: false, infoBox: false, selectionIndicator: false,
    baseLayer: google ? false : new C.ImageryLayer(new C.OpenStreetMapImageryProvider({url: 'https://tile.openstreetmap.org/'})),
    msaaSamples: 4, shadows: true, terrainShadows: C.ShadowMode.RECEIVE_ONLY,
  });
  const scene = viewer.scene;
  scene.globe.show = !google;
  scene.highDynamicRange = true;
  scene.postProcessStages.tonemapper = C.Tonemapper.PBR_NEUTRAL;
  scene.postProcessStages.exposure = 1.05;
  scene.postProcessStages.fxaa.enabled = true;
  scene.skyAtmosphere.show = true;
  scene.fog.enabled = true; scene.fog.density = 1.4e-4;
  scene.light = new C.SunLight({intensity: 2.3});
  // 10:30 a.m. en Bogota (UTC-5): sol alto y sombras cortas como en los renders de Unreal
  viewer.clock.currentTime = C.JulianDate.fromIso8601('2026-11-06T15:30:00Z');
  viewer.clock.shouldAnimate = false;
  const sm = viewer.shadowMap; sm.size = 4096; sm.softShadows = true; sm.darkness = 0.45; sm.maximumDistance = 2500;
  const ctl = scene.screenSpaceCameraController;
  ctl.minimumZoomDistance = 4; ctl.maximumZoomDistance = 9000;
  ctl.enableCollisionDetection = true;

  // georreferencia: origen local EPSG:9377 (4884540, 2077660), z = 2549 msnm -> elipsoide + geoide
  const h = google ? geo.h : 0;
  const origin = C.Cartesian3.fromDegrees(geo.lon, geo.lat, h);
  const M = C.Transforms.eastNorthUpToFixedFrame(origin);
  const R = C.Matrix4.fromRotationTranslation(C.Matrix3.fromRotationZ(C.Math.toRadians(geo.rot_deg)));
  C.Matrix4.multiply(M, R, M);
  C.Matrix4.multiplyByUniformScale(M, geo.scale, M);

  step(10, 'Ciudad real (Google 3D)');
  let tiles = null;
  if (google) {
    try {
      tiles = cfg.googleMapsKey
        ? await C.createGooglePhotorealistic3DTileset({key: cfg.googleMapsKey}, {maximumScreenSpaceError: 8})
        : await C.createGooglePhotorealistic3DTileset(undefined, {maximumScreenSpaceError: 8});
      tiles.shadows = C.ShadowMode.RECEIVE_ONLY;
      // recorta Google donde va nuestro modelo
      tiles.clippingPolygons = new C.ClippingPolygonCollection({polygons: [new C.ClippingPolygon({positions: C.Cartesian3.fromDegreesArray(geo.clip.flat())})]});
      scene.primitives.add(tiles);
    } catch (e) { console.error(e); warn('No se pudo cargar Google 3D (revisa la llave en config.js). Se muestra solo el modelo.'); scene.globe.show = true; }
  } else warn('Falta la llave de Cesium ion / Google en config.js: se muestra el modelo sobre un mapa plano.');

  step(30, 'Edificios, vías y terreno');
  const load = (url, p, t) => C.Model.fromGltfAsync({url, modelMatrix: M, shadows: C.ShadowMode.ENABLED, backFaceCulling: true,
      imageBasedLighting: undefined}).then(m => { scene.primitives.add(m); step(p, t); return m; });
  const [ciudad, arboles] = await Promise.all([load('modelo/ciudad.glb', 75, 'Árboles'), load('modelo/arboles.glb', 90, 'Listo')]);
  arboles.shadows = C.ShadowMode.CAST_ONLY;

  // ---------- pines
  const pins = [
    {label: 'Hotel Estelar La Fontana', lon: geo.hotel[0], lat: geo.hotel[1], up: 30, main: true},
    {label: 'Centro Comercial Unicentro', lon: -74.04145, lat: 4.70208, up: 25},
  ];
  const pinsEl = document.getElementById('pins');
  pins.forEach(p => {
    p.pos = C.Cartesian3.fromDegrees(p.lon, p.lat, h + 11 + p.up);
    p.el = document.createElement('div'); p.el.className = 'pin' + (p.main ? ' main' : '');
    p.el.innerHTML = `<span class="${p.main ? '' : 'glass'}">${p.label}</span><i></i>`; pinsEl.appendChild(p.el);
  });
  const tmp = new C.Cartesian2();
  scene.postRender.addEventListener(() => {
    pins.forEach(p => {
      const s = C.SceneTransforms.worldToWindowCoordinates(scene, p.pos, tmp);
      const vis = s && C.Cartesian3.distance(scene.camera.positionWC, p.pos) < 6000;
      p.el.style.opacity = vis ? 1 : 0;
      if (s) { p.el.style.left = s.x + 'px'; p.el.style.top = s.y + 'px'; }
    });
    document.querySelector('#compass svg').style.transform = `rotate(${-C.Math.toDegrees(scene.camera.heading)}deg)`;
  });

  // ---------- vistas
  const hotel = C.Cartesian3.fromDegrees(geo.hotel[0], geo.hotel[1], h + 12);
  const uni = C.Cartesian3.fromDegrees(-74.04145, 4.70208, h + 8);
  const views = [
    {label: 'Hotel La Fontana', target: hotel, heading: 215, pitch: -32, range: 380},
    {label: 'Fachada Calle 127', target: hotel, heading: 175, pitch: -12, range: 150},
    {label: 'Unicentro', target: uni, heading: 330, pitch: -35, range: 650},
    {label: 'Vista aérea', target: C.Cartesian3.fromDegrees(geo.lon - 0.001, geo.lat + 0.001, h), heading: 20, pitch: -58, range: 2300},
  ];
  const bar = document.getElementById('bar');
  function go(v, i, dur = 2.2) {
    stopOrbit();
    [...bar.children].forEach((b, k) => b.classList.toggle('on', k === i));
    const s = new C.BoundingSphere(v.target, 1);
    viewer.camera.flyToBoundingSphere(s, {duration: dur, offset: new C.HeadingPitchRange(C.Math.toRadians(v.heading), C.Math.toRadians(v.pitch), v.range)});
  }
  views.forEach((v, i) => { const b = document.createElement('button'); b.textContent = v.label; b.onclick = () => go(v, i); bar.appendChild(b); });

  // ---------- orbita alrededor del hotel
  let orbiting = false, orbitFn = null;
  function stopOrbit() {
    if (!orbiting) return; orbiting = false; document.getElementById('orbit').classList.remove('on');
    viewer.clock.onTick.removeEventListener(orbitFn); viewer.camera.lookAtTransform(C.Matrix4.IDENTITY);
  }
  function startOrbit() {
    const cam = viewer.camera;
    const tgt = pickCenter() || hotel;
    const range = Math.max(120, Math.min(1500, C.Cartesian3.distance(cam.positionWC, tgt)));
    let hd = cam.heading; const pt = Math.min(-0.15, cam.pitch);
    orbiting = true; document.getElementById('orbit').classList.add('on');
    let last = performance.now();
    orbitFn = () => { const now = performance.now(); hd += (now - last) * 0.00006; last = now; cam.lookAt(tgt, new C.HeadingPitchRange(hd, pt, range)); };
    viewer.clock.onTick.addEventListener(orbitFn);
  }
  function pickCenter() {
    const c = new C.Cartesian2(viewer.canvas.clientWidth / 2, viewer.canvas.clientHeight / 2);
    const p = scene.pickPositionSupported ? scene.pickPosition(c) : undefined;
    return p && C.defined(p) ? p : undefined;
  }
  viewer.clock.shouldAnimate = true; viewer.clock.multiplier = 0; // ticks sin mover el sol
  document.getElementById('orbit').onclick = () => orbiting ? stopOrbit() : startOrbit();
  ['pointerdown', 'wheel'].forEach(ev => viewer.canvas.addEventListener(ev, () => { stopOrbit(); document.getElementById('hint').style.opacity = 0; }, {passive: true}));
  document.getElementById('compass').onclick = () => {
    const tgt = pickCenter() || hotel; const r = C.Cartesian3.distance(viewer.camera.positionWC, tgt);
    viewer.camera.flyToBoundingSphere(new C.BoundingSphere(tgt, 1), {duration: 1, offset: new C.HeadingPitchRange(0, viewer.camera.pitch, r)});
  };
  const sunBtn = document.getElementById('sun'); sunBtn.classList.add('on');
  sunBtn.onclick = () => { viewer.shadows = !viewer.shadows; sunBtn.classList.toggle('on', viewer.shadows); };
  // celulares: sombras apagadas por rendimiento
  if (Math.min(innerWidth, innerHeight) < 700) { viewer.shadows = false; sunBtn.classList.remove('on'); viewer.resolutionScale = Math.min(devicePixelRatio, 1.5) / devicePixelRatio * 1.0; }

  function warn(t) { const w = document.getElementById('warn'); w.textContent = t; w.style.display = 'block'; }

  go(views[0], 0, 0);
  step(100, 'Listo');
  const L = document.getElementById('loader'); setTimeout(() => { L.style.opacity = 0; setTimeout(() => L.remove(), 800); }, 600);
  setTimeout(startOrbit, 1500);
  window.viewer = viewer;
})();
</script>
</body>
</html>

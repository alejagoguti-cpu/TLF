<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hotel La Fontana – Unicentro | 3D Ultra Realista</title>
<meta name="description" content="Visualizador 3D fotorrealista con Three.js, NASA-AMMOS/3DTilesRendererJS y pmndrs/postprocessing">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/",
    "3d-tiles-renderer": "https://unpkg.com/3d-tiles-renderer@0.5.4/build/index.js",
    "3d-tiles-renderer/plugins": "https://unpkg.com/3d-tiles-renderer@0.5.4/build/index.plugins.js",
    "postprocessing": "https://unpkg.com/postprocessing@6.36.0/build/index.js"
  }
}
</script>
<style>
  :root{--ink:#111;--paper:#fff;--muted:rgba(255,255,255,.85);--pill:rgba(255,255,255,.92);--line:rgba(0,0,0,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;background:#0a0e14;font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  #webgl-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}

  /* Marca superior */
  #brand{position:fixed;left:18px;top:18px;background:var(--paper);padding:10px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:10;border-radius:2px}
  #brand b{display:block;font:500 17px "Playfair Display",serif;letter-spacing:.4px;color:var(--ink)}
  #brand small{display:block;font:600 9.5px Inter,sans-serif;letter-spacing:2.5px;color:#666;text-transform:uppercase;margin-top:2px}

  /* Selector de Contexto */
  #ctx{position:fixed;top:18px;right:74px;display:flex;background:var(--paper);box-shadow:0 6px 22px rgba(0,0,0,.2);z-index:10;border-radius:2px;overflow:hidden}
  #ctx button{border:0;background:transparent;font:600 11px Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;padding:0 14px;height:42px;cursor:pointer;color:#222;transition:all .15s}
  #ctx button.on{background:#111;color:#fff}

  /* Botones de Herramientas */
  #tools{position:fixed;top:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:10}
  #tools button{width:42px;height:42px;display:grid;place-items:center;color:#111;background:var(--paper);border:0;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.2);border-radius:2px;transition:all .15s}
  #tools button:hover{background:#f5f5f5}
  #tools button.on{background:#111;color:#fff}
  #tools svg{width:20px;height:20px}

  /* Panel Interactivo de Iluminacion y Sombras */
  #panelLuz{position:fixed;top:70px;right:18px;background:var(--paper);box-shadow:0 12px 36px rgba(0,0,0,.3);z-index:15;padding:16px 18px;width:320px;border-radius:4px;display:none;flex-direction:column;gap:12px}
  #panelLuz.on{display:flex}
  #panelLuz .tit{display:flex;justify-content:space-between;align-items:center;font:600 11px Inter,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:#111}
  #panelLuz .modo-luz{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #panelLuz .modo-luz button{border:1px solid var(--line);background:#fafafa;padding:8px 6px;font:700 11.5px Inter,sans-serif;color:#222;cursor:pointer;border-radius:2px;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
  #panelLuz .modo-luz button:hover{background:#f0f0f0}
  #panelLuz .modo-luz button.on{background:#111;color:#fff;border-color:#111}
  #panelLuz .horas{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  #panelLuz .horas button{border:1px solid var(--line);background:#fafafa;padding:6px 2px;font:600 10.5px Inter,sans-serif;color:#222;cursor:pointer;border-radius:2px;transition:all .15s;text-align:center}
  #panelLuz .horas button:hover{background:#f0f0f0}
  #panelLuz .horas button.on{background:#111;color:#fff;border-color:#111}
  #panelLuz .fil{display:flex;flex-direction:column;gap:5px}
  #panelLuz .fil label{display:flex;justify-content:space-between;font:500 11.5px Inter,sans-serif;color:#444}
  #panelLuz .fil label b{font-weight:700;color:#111}
  #panelLuz input[type=range]{width:100%;accent-color:#111;cursor:pointer}
  #panelLuz .shd-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px}
  #panelLuz .shd-row span{font:500 11.5px Inter,sans-serif;color:#444}
  #panelLuz .shd-row button{border:1px solid var(--line);background:#fafafa;padding:5px 12px;font:600 11px Inter,sans-serif;cursor:pointer;border-radius:2px}
  #panelLuz .shd-row button.on{background:#111;color:#fff;border-color:#111}

  /* Menu lateral de Vistas (estilo DMCC) */
  #menu{position:fixed;left:0;bottom:0;width:185px;background:var(--paper);box-shadow:0 8px 30px rgba(0,0,0,.22);z-index:10}
  #menu button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;
    font:500 13px Inter,sans-serif;color:var(--ink);text-align:left;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
  #menu button:first-child{border-top:0}
  #menu button:hover{background:#f2f2f2}
  #menu button.on{background:#111;color:#fff}

  /* Tarjetas de Distancia */
  #cards{position:fixed;left:215px;bottom:24px;display:flex;gap:44px;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.6);pointer-events:none;z-index:10}
  #cards .c small{display:block;font:600 11px Inter,sans-serif;letter-spacing:1.4px;text-transform:uppercase;line-height:1.35;opacity:.95}
  #cards .c div{display:flex;align-items:baseline;gap:6px;margin-top:6px}
  #cards .c b{font:400 38px "Playfair Display",serif;line-height:1}
  #cards .c span{font:400 16px "Playfair Display",serif;line-height:1.05}

  /* Pines 3D flotantes */
  #pins{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
  #pins .pin{position:absolute;transform:translate(-50%,-100%);transition:opacity .25s}
  #pins .pin span{display:block;padding:5px 9px;background:var(--pill);color:#111;font:600 10px Inter,sans-serif;letter-spacing:1px;
    text-transform:uppercase;border-radius:4px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  #pins .pin i{display:block;width:1.5px;height:16px;margin:0 auto;background:rgba(255,255,255,.9)}
  #pins .pin.main span{background:rgba(255,255,255,.96);padding:8px 14px 6px;border-radius:2px;text-align:center}
  #pins .pin.main span b{display:block;font:500 18px "Playfair Display",serif;letter-spacing:.5px;text-transform:none;color:#111}
  #pins .pin.main span em{display:block;font:600 8.5px Inter,sans-serif;font-style:normal;letter-spacing:3px;color:#666}
  #pins .pin.main i{height:55px;width:2px;background:linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,0))}

  /* Indicador de ayuda y avisos */
  #hint{position:fixed;top:70px;left:50%;transform:translateX(-50%);font-size:11.5px;color:#fff;background:rgba(0,0,0,.65);padding:7px 16px;border-radius:20px;transition:opacity .6s;z-index:10;white-space:nowrap;pointer-events:none}
  #warn{position:fixed;top:78px;left:18px;max-width:min(380px,calc(100% - 36px));font-size:12px;padding:9px 12px;color:#5a3b00;background:#fff3d6;display:none;z-index:15;box-shadow:0 6px 20px rgba(0,0,0,.2)}

  /* Pantalla de Carga */
  #loader{position:fixed;inset:0;display:grid;place-items:center;background:#0d1117;z-index:100;transition:opacity .8s}
  #loader .box{width:min(340px,82vw);text-align:center;color:#fff}
  #loader b{font:500 24px "Playfair Display",serif;display:block;color:#f0f6fc}
  #loader .track{height:3px;background:rgba(255,255,255,.15);margin-top:18px;overflow:hidden;border-radius:2px}
  #loader .fill{height:100%;width:0;background:linear-gradient(90deg,#7dd3fc,#34d399);transition:width .3s}
  #loader small{display:block;margin-top:12px;color:#8b949e;font-size:11px;letter-spacing:1.6px;text-transform:uppercase}

  @media (max-width:760px){
    #menu{width:100%;display:flex;overflow-x:auto}
    #menu button{border-top:0;border-left:1px solid var(--line);white-space:nowrap;width:auto;padding:12px 14px}
    #cards{left:18px;bottom:64px;gap:24px}#cards .c b{font-size:30px}#cards .c span{font-size:13px}
    #ctx{right:18px;top:auto;bottom:118px}#panelLuz{top:auto;bottom:170px;right:18px;left:18px;width:auto}
    #tools{top:18px}
  }
</style>
</head>
<body>
<canvas id="webgl-canvas"></canvas>
<div id="pins"></div>
<div id="brand"><b>Hotel La Fontana</b><small>Unicentro – Bogotá</small></div>
<div id="ctx"><button data-c="modelo" class="on">Modelo</button><button data-c="real">Ciudad real</button></div>

<div id="panelLuz">
  <div class="tit"><span>Iluminación & Hora</span><b id="txtHora">10:30 AM</b></div>
  <div class="modo-luz">
    <button id="btnModoDia" class="on">☀️ Modo Día</button>
    <button id="btnModoNoche">🌙 Modo Noche</button>
  </div>
  <div class="horas">
    <button data-h="6.5">🌅 06:30</button>
    <button data-h="10.5" class="on">☀️ 10:30</button>
    <button data-h="13.5">🌤️ 13:30</button>
    <button data-h="17.5">🌇 17:30</button>
    <button data-h="20.5">🌃 20:30</button>
    <button data-h="23.5">🌌 23:30</button>
  </div>
  <div class="fil">
    <label><span>Hora del día (Bogotá)</span><b id="valHora">10:30 AM</b></label>
    <input type="range" id="slHora" min="0.0" max="23.75" step="0.25" value="10.5">
  </div>
  <div class="fil">
    <label><span>Intensidad de luz</span><b id="valInt">2.8</b></label>
    <input type="range" id="slInt" min="0.2" max="5.0" step="0.1" value="2.8">
  </div>
  <div class="shd-row">
    <span>Sombras proyectadas</span>
    <button id="btnShd" class="on">Activadas</button>
  </div>
</div>

<div id="tools">
  <button id="compass" title="Mirar al norte"><svg viewBox="0 0 40 40"><path d="M20 3l6 17h-12z" fill="#e9564a"/><path d="M20 37l-6-17h12z" fill="currentColor"/></svg></button>
  <button id="orbit" title="Girar alrededor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
  <button id="sun" title="Iluminación y sombras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</div>
<div id="hint">Arrastra para moverte • clic derecho o Ctrl + arrastrar para pivotear • rueda para acercar</div>
<div id="warn"></div>
<nav id="menu"></nav>
<div id="cards"></div>
<div id="loader"><div class="box"><b>Hotel La Fontana</b><div class="track"><div class="fill" id="fill"></div></div><small id="pct">Inicializando Three.js & Postprocessing</small></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TilesRenderer } from '3d-tiles-renderer';
import { GoogleCloudAuthPlugin, ReorientationPlugin } from '3d-tiles-renderer/plugins';
import * as POST from 'postprocessing';

(async () => {
  const step = (p, t) => {
    const f = document.getElementById('fill'); if (f) f.style.width = p + '%';
    const pc = document.getElementById('pct'); if (pc) pc.textContent = t;
  };
  const warn = (t) => { const w = document.getElementById('warn'); w.textContent = t; w.style.display = 'block'; };

  const geo = await (await fetch('geo.json')).json();
  const cfg = window.TLF_CONFIG || {};

  // 1. Escena y Camara Three.js
  const canvas = document.getElementById('webgl-canvas');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa4c2db);
  scene.fog = new THREE.FogExp2(0xa4c2db, 0.00015);

  const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 1, 60000);
  camera.position.set(-250, 480, 750);

  // 2. Renderer con High-Performance y Sombras Suaves
  const renderer = new THREE.WebGLRenderer({
    canvas,
    powerPreference: 'high-performance',
    antialias: false,
    stencil: false,
    depth: true
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // 3. Postprocessing pipeline con pmndrs/postprocessing
  const composer = new POST.EffectComposer(renderer);
  composer.addPass(new POST.RenderPass(scene, camera));

  const bloomEffect = new POST.BloomEffect({
    intensity: 0.35,
    luminanceThreshold: 0.85,
    luminanceSmoothing: 0.25,
    mipmapBlur: true
  });

  const toneMappingEffect = new POST.ToneMappingEffect({
    mode: POST.ToneMappingMode.ACES_FILMIC,
    resolution: 256,
    whitePoint: 4.0,
    middleGrey: 0.6
  });

  const vignetteEffect = new POST.VignetteEffect({
    offset: 0.35,
    darkness: 0.35
  });

  const smaaEffect = new POST.SMAAEffect();

  const effectPass = new POST.EffectPass(camera, bloomEffect, toneMappingEffect, vignetteEffect, smaaEffect);
  composer.addPass(effectPass);

  // 4. Luces Arquitectonicas Calibradas
  const hemiLight = new THREE.HemisphereLight(0xfff6ea, 0x5b6572, 1.4);
  scene.add(hemiLight);

  const sunLight = new THREE.DirectionalLight(0xfffaed, 2.8);
  sunLight.position.set(450, 850, 350);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 4096;
  sunLight.shadow.mapSize.height = 4096;
  sunLight.shadow.camera.near = 100;
  sunLight.shadow.camera.far = 4000;
  sunLight.shadow.bias = -0.0001;
  const d = 1200;
  sunLight.shadow.camera.left = -d;
  sunLight.shadow.camera.right = d;
  sunLight.shadow.camera.top = d;
  sunLight.shadow.camera.bottom = -d;
  scene.add(sunLight);

  // 5. NASA-AMMOS / 3DTilesRendererJS (Google Photorealistic 3D Tiles)
  step(20, 'Cargando Google 3D Tiles');
  let tiles = null;
  if (cfg.googleMapsKey) {
    try {
      tiles = new TilesRenderer('https://tile.googleapis.com/v1/3dtiles/root.json');
      tiles.registerPlugin(new GoogleCloudAuthPlugin({ apiToken: cfg.googleMapsKey }));
      tiles.registerPlugin(new ReorientationPlugin({
        up: '+y',
        lat: geo.lat,
        lon: geo.lon,
        height: geo.h,
        recenter: true
      }));
      scene.add(tiles.group);
    } catch(e) {
      console.error(e);
      warn('No se pudo cargar Google 3D Tiles con la llave configurada.');
    }
  } else {
    warn('Falta googleMapsKey en config.js para la ciudad 3D fotorrealista.');
  }

  // 6. Carga de Edificios, Vías, Andenes y Árboles Botánicos
  step(45, 'Cargando arquitectura PBR');
  const gltfLoader = new GLTFLoader();

  const loadGLTF = (url, prog, txt) => new Promise((resolve, reject) => {
    gltfLoader.load(url, (gltf) => {
      step(prog, txt);
      resolve(gltf.scene);
    }, undefined, reject);
  });

  let ciudadGroup = new THREE.Group();
  scene.add(ciudadGroup);

  try {
    const [ciudadScene, arbolesScene] = await Promise.all([
      loadGLTF('modelo/ciudad.glb', 75, 'Cargando árboles botánicos 3D'),
      loadGLTF('modelo/arboles.glb', 90, 'Configurando escena ultra realista')
    ]);

    // Posicionar modelo ligeramente sobre el terreno para evitar z-fighting
    ciudadScene.position.set(0, 0.6, 0);
    ciudadScene.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        if (child.material) {
          child.material.envMapIntensity = 1.0;
        }
      }
    });
    ciudadGroup.add(ciudadScene);

    arbolesScene.position.set(0, 0.6, 0);
    arbolesScene.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
    ciudadGroup.add(arbolesScene);
  } catch(err) {
    console.error('Error cargando modelos:', err);
  }

  // 7. Controles de Cámara
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.screenSpacePanning = false;
  controls.minDistance = 25;
  controls.maxDistance = 15000;
  controls.maxPolarAngle = Math.PI / 2 - 0.02; // Evitar pasar por debajo del suelo
  controls.target.set(-246, 15, -291); // Foco en Hotel La Fontana

  // 8. Contexto: Modelo Arquitectónico vs Ciudad Real Pura
  document.querySelectorAll('#ctx button').forEach(b => b.onclick = () => {
    if (b.dataset.c === 'real' && !tiles) { warn('La ciudad real necesita la llave de Google 3D en config.js.'); return; }
    document.querySelectorAll('#ctx button').forEach(x => x.classList.toggle('on', x === b));
    const real = b.dataset.c === 'real';
    ciudadGroup.visible = !real;
  });

  // 9. Vistas Predefinidas
  const views = [
    { label: 'Ubicación', pos: [-550, 850, 1400], target: [-246, 15, -291] },
    { label: 'Master plan', pos: [-350, 520, 680], target: [-246, 15, -291] },
    { label: 'Hotel La Fontana', pos: [-140, 65, -170], target: [-246, 20, -291] },
    { label: 'Fachada Calle 127', pos: [-246, 22, -180], target: [-246, 18, -320] },
    { label: 'Unicentro', pos: [220, 180, 260], target: [0, 15, 0] }
  ];

  let tweenCam = null;
  function flyToView(v, duration = 2000) {
    stopOrbit();
    const startPos = camera.position.clone();
    const startTgt = controls.target.clone();
    const endPos = new THREE.Vector3(...v.pos);
    const endTgt = new THREE.Vector3(...v.target);
    const startTime = performance.now();

    tweenCam = () => {
      const now = performance.now();
      const t = Math.min(1, (now - startTime) / duration);
      // Ease in-out cubic
      const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      camera.position.lerpVectors(startPos, endPos, ease);
      controls.target.lerpVectors(startTgt, endTgt, ease);
      if (t >= 1) tweenCam = null;
    };
  }

  const menu = document.getElementById('menu');
  views.forEach((v, i) => {
    const b = document.createElement('button');
    b.textContent = v.label;
    b.onclick = () => {
      [...menu.children].forEach((x, k) => x.classList.toggle('on', k === i));
      flyToView(v);
    };
    menu.appendChild(b);
  });
  if (menu.children[2]) menu.children[2].classList.add('on');

  // 10. Orbita Continua
  let orbiting = false;
  function stopOrbit() {
    if (!orbiting) return;
    orbiting = false;
    document.getElementById('orbit').classList.remove('on');
  }
  function toggleOrbit() {
    orbiting = !orbiting;
    document.getElementById('orbit').classList.toggle('on', orbiting);
  }
  document.getElementById('orbit').onclick = toggleOrbit;
  renderer.domElement.addEventListener('pointerdown', () => { stopOrbit(); document.getElementById('hint').style.opacity = 0; }, { passive: true });
  renderer.domElement.addEventListener('wheel', () => { stopOrbit(); document.getElementById('hint').style.opacity = 0; }, { passive: true });

  // Brujula
  document.getElementById('compass').onclick = () => {
    const r = camera.position.distanceTo(controls.target);
    flyToView({ pos: [controls.target.x, controls.target.y + r * 0.45, controls.target.z + r * 0.85], target: [controls.target.x, controls.target.y, controls.target.z] }, 1200);
  };

  // 11. Motor de Iluminacion Dinamica Dia / Noche y Sol
  let curHour = 10.5, isNight = false, baseInt = 2.8;

  function formatHora(hDec) {
    const hNorm = ((hDec % 24) + 24) % 24;
    const hh = Math.floor(hNorm);
    const mm = Math.round((hNorm % 1) * 60) % 60;
    const ampm = hh >= 12 ? 'PM' : 'AM';
    const h12 = hh > 12 ? hh - 12 : (hh === 0 ? 12 : hh);
    return `${String(h12).padStart(2,'0')}:${String(mm).padStart(2,'0')} ${ampm}`;
  }

  function applyLuz(hDec, forceNight = null) {
    curHour = ((hDec % 24) + 24) % 24;
    const autoNight = curHour < 5.75 || curHour > 18.25;
    isNight = forceNight !== null ? forceNight : autoNight;

    const txt = formatHora(curHour);
    document.getElementById('txtHora').textContent = txt;
    document.getElementById('valHora').textContent = txt;
    document.getElementById('slHora').value = curHour;

    document.getElementById('btnModoDia').classList.toggle('on', !isNight);
    document.getElementById('btnModoNoche').classList.toggle('on', isNight);
    document.querySelectorAll('#panelLuz .horas button').forEach(b => {
      b.classList.toggle('on', Math.abs(parseFloat(b.dataset.h) - curHour) < 0.5);
    });

    // Angulo solar segun hora
    const sunAngle = (curHour - 6.0) / 12.0 * Math.PI; // 0 en amanecer, PI en atardecer
    const sunElev = Math.sin(sunAngle);
    const sunAzim = -Math.cos(sunAngle);

    if (isNight) {
      // Noche lunar: luz azulada suave y cielo oscuro
      scene.background.set(0x0a101d);
      scene.fog.color.set(0x0a101d);
      hemiLight.color.set(0x2c4365);
      hemiLight.groundColor.set(0x0a101a);
      hemiLight.intensity = 0.5;

      sunLight.color.set(0x7da4d4);
      sunLight.position.set(-300, 600, -400);
      sunLight.intensity = Math.max(0.4, baseInt * 0.25);
    } else {
      // Dia soleado: cielo claro y sol brillante
      const skyCol = new THREE.Color(0xa4c2db).lerp(new THREE.Color(0xf6d6b2), Math.max(0, 1 - sunElev * 2));
      scene.background.copy(skyCol);
      scene.fog.color.copy(skyCol);

      hemiLight.color.set(0xfff6ea);
      hemiLight.groundColor.set(0x5b6572);
      hemiLight.intensity = 1.1 + sunElev * 0.4;

      const warmSun = new THREE.Color(0xfffaed).lerp(new THREE.Color(0xffaa55), Math.max(0, 1 - sunElev * 1.8));
      sunLight.color.copy(warmSun);
      sunLight.position.set(sunAzim * 800 + 150, Math.max(120, sunElev * 1000), 400);
      sunLight.intensity = baseInt * Math.max(0.4, sunElev);
    }
  }

  document.getElementById('btnModoDia').onclick = () => applyLuz(10.5, false);
  document.getElementById('btnModoNoche').onclick = () => applyLuz(21.0, true);
  document.querySelectorAll('#panelLuz .horas button').forEach(b => {
    b.onclick = () => applyLuz(parseFloat(b.dataset.h));
  });

  const slHora = document.getElementById('slHora');
  slHora.oninput = () => applyLuz(parseFloat(slHora.value));

  const slInt = document.getElementById('slInt');
  slInt.oninput = () => {
    baseInt = parseFloat(slInt.value);
    document.getElementById('valInt').textContent = baseInt.toFixed(1);
    applyLuz(curHour, isNight);
  };

  const btnShd = document.getElementById('btnShd');
  btnShd.onclick = () => {
    renderer.shadowMap.enabled = !renderer.shadowMap.enabled;
    btnShd.classList.toggle('on', renderer.shadowMap.enabled);
    btnShd.textContent = renderer.shadowMap.enabled ? 'Activadas' : 'Desactivadas';
  };

  const sunBtn = document.getElementById('sun');
  sunBtn.onclick = () => {
    const p = document.getElementById('panelLuz');
    p.classList.toggle('on');
    sunBtn.classList.toggle('on', p.classList.contains('on'));
  };

  // 12. Pines Flotantes 3D
  const hotelPos = new THREE.Vector3(-246, 25, -291);
  const places = [
    { label: 'Hotel La Fontana', sub: 'ESTELAR', pos: hotelPos, main: true },
    { label: 'Unicentro', pos: new THREE.Vector3(0, 20, 0) },
    { label: 'Usaquén', pos: new THREE.Vector3(1200, 20, -500) },
    { label: 'Parque de la 93', pos: new THREE.Vector3(-600, 20, 2400) },
    { label: 'Cerros Orientales', pos: new THREE.Vector3(2600, 280, 0) }
  ];

  const pinsEl = document.getElementById('pins');
  places.forEach(p => {
    p.el = document.createElement('div');
    p.el.className = 'pin' + (p.main ? ' main' : '');
    p.el.innerHTML = p.main
      ? `<span><b>${p.label}</b><em>${p.sub}</em></span><i></i>`
      : `<span>${p.label}</span><i></i>`;
    pinsEl.appendChild(p.el);
  });

  const tempV = new THREE.Vector3();
  function updatePins() {
    places.forEach(p => {
      tempV.copy(p.pos);
      tempV.project(camera);
      const isBehind = tempV.z > 1.0;
      const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-(tempV.y * 0.5) + 0.5) * window.innerHeight;
      const dist = camera.position.distanceTo(p.pos);
      const visible = !isBehind && dist < (p.main ? 18000 : 8000) && dist > 50;
      p.el.style.opacity = visible ? 1 : 0;
      if (visible) {
        p.el.style.left = `${x}px`;
        p.el.style.top = `${y}px`;
      }
    });

    // Actualizar brujula
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const angleDeg = Math.atan2(dir.x, -dir.z) * (180 / Math.PI);
    document.querySelector('#compass svg').style.transform = `rotate(${angleDeg}deg)`;
  }

  // Tarjetas inferiores
  document.getElementById('cards').innerHTML = `
    <div class="c"><small>Unicentro</small><div><b>380</b><span>metros</span></div></div>
    <div class="c"><small>Usaquén</small><div><b>1,8</b><span>km</span></div></div>
    <div class="c"><small>Parque de la 93</small><div><b>3,2</b><span>km</span></div></div>
  `;

  // 13. Redimensionamiento
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });

  // 14. Bucle Principal de Renderizado
  applyLuz(10.5, false);
  step(100, 'Listo');
  const L = document.getElementById('loader');
  setTimeout(() => {
    L.style.opacity = 0;
    setTimeout(() => L.remove(), 800);
  }, 600);

  let lastTime = performance.now();
  function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const dt = (now - lastTime) * 0.001;
    lastTime = now;

    if (tweenCam) tweenCam();

    if (orbiting) {
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.6;
    } else {
      controls.autoRotate = false;
    }

    controls.update();

    if (tiles) {
      tiles.setCamera(camera);
      tiles.setResolutionFromRenderer(camera, renderer);
      tiles.update();
    }

    updatePins();

    // Renderizado con pmndrs/postprocessing
    composer.render(dt);
  }

  animate();
})();
</script>
</body>
</html>

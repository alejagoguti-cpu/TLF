<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hotel La Fontana · Unicentro</title>
<meta name="description" content="Modelo 3D navegable del entorno del Hotel Estelar La Fontana y Unicentro, Bogotá">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/Cesium.js"></script>
<script src="config.js"></script>
<style>
  :root{--ink:#111;--paper:#fff;--muted:rgba(255,255,255,.82);--pill:rgba(255,255,255,.9);--line:rgba(0,0,0,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#cfd8de;font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  #map{position:fixed;inset:0}
  .cesium-viewer-bottom{display:none}

  /* menu lateral (estilo dmcc) */
  #menu{position:fixed;left:0;bottom:0;width:178px;background:var(--paper);box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:3}
  #menu button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;
    font:500 13px Inter,sans-serif;color:var(--ink);text-align:left;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
  #menu button:first-child{border-top:0}
  #menu button:hover{background:#f2f2f2}
  #menu button.on{background:#111;color:#fff}
  #brand{position:fixed;left:16px;top:16px;background:var(--paper);padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:3}
  #brand b{display:block;font:500 17px "Playfair Display",serif;letter-spacing:.4px;color:var(--ink)}
  #brand small{display:block;font:600 9.5px Inter,sans-serif;letter-spacing:2.6px;color:#777;text-transform:uppercase;margin-top:2px}

  /* tarjetas de distancia */
  #cards{position:fixed;left:210px;bottom:22px;display:flex;gap:44px;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.45);pointer-events:none;z-index:2}
  #cards .c small{display:block;font:600 11px Inter,sans-serif;letter-spacing:1.4px;text-transform:uppercase;line-height:1.35;opacity:.95}
  #cards .c div{display:flex;align-items:baseline;gap:6px;margin-top:6px}
  #cards .c b{font:400 40px "Playfair Display",serif;line-height:1}
  #cards .c span{font:400 17px "Playfair Display",serif;line-height:1.05}

  /* pines */
  #pins .pin{position:fixed;transform:translate(-50%,-100%);pointer-events:none;transition:opacity .25s;z-index:1}
  #pins .pin span{display:block;padding:4px 8px;background:var(--pill);color:#222;font:600 10px Inter,sans-serif;letter-spacing:1px;
    text-transform:uppercase;border-radius:6px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  #pins .pin i{display:block;width:1px;height:14px;margin:0 auto;background:rgba(255,255,255,.85)}
  #pins .pin.main span{background:rgba(255,255,255,.94);padding:8px 12px 6px;border-radius:2px;text-align:center}
  #pins .pin.main span b{display:block;font:500 19px "Playfair Display",serif;letter-spacing:.5px;text-transform:none;color:#111}
  #pins .pin.main span em{display:block;font:600 8.5px Inter,sans-serif;font-style:normal;letter-spacing:3px;color:#666}
  #pins .pin.main i{height:60px;width:2px;background:linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,0))}

  /* herramientas */
  #tools{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:3}
  #tools button{width:42px;height:42px;display:grid;place-items:center;color:#111;background:var(--paper);border:0;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.15)}
  #tools button.on{background:#111;color:#fff}
  #tools svg{width:20px;height:20px}
  #ctx{position:fixed;top:16px;right:70px;display:flex;background:var(--paper);box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:3}
  #ctx button{border:0;background:transparent;font:600 11px Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;padding:0 12px;height:42px;cursor:pointer;color:#111}
  #ctx button.on{background:#111;color:#fff}
  #hint{position:fixed;top:68px;right:70px;font-size:11.5px;color:#fff;background:rgba(0,0,0,.45);padding:7px 11px;transition:opacity .6s;z-index:2;max-width:330px}
  #warn{position:fixed;top:78px;left:16px;max-width:min(380px,calc(100% - 32px));font-size:12px;padding:9px 12px;color:#5a3b00;background:#fff3d6;display:none;z-index:3;box-shadow:0 6px 20px rgba(0,0,0,.15)}

  #loader{position:fixed;inset:0;display:grid;place-items:center;background:#e9ecee;z-index:9;transition:opacity .8s}
  #loader .box{width:min(320px,80vw);text-align:center;color:#111}
  #loader b{font:500 22px "Playfair Display",serif}
  #loader .track{height:2px;background:rgba(0,0,0,.1);margin-top:16px;overflow:hidden}
  #loader .fill{height:100%;width:0;background:#111;transition:width .3s}
  #loader small{display:block;margin-top:10px;color:#666;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}

  @media (max-width:760px){
    #menu{width:100%;display:flex;overflow-x:auto}
    #menu button{border-top:0;border-left:1px solid var(--line);white-space:nowrap;width:auto;padding:12px 14px}
    #cards{left:16px;bottom:62px;gap:24px}#cards .c b{font-size:30px}#cards .c span{font-size:14px}
    #ctx{right:16px;top:auto;bottom:118px}#hint{display:none}
    #tools{top:16px}
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="pins"></div>
<div id="brand"><b>Hotel La Fontana</b><small>Unicentro · Bogotá</small></div>
<div id="ctx"><button data-c="modelo" class="on">Modelo</button><button data-c="real">Ciudad real</button></div>
<div id="tools">
  <button id="compass" title="Mirar al norte"><svg viewBox="0 0 40 40"><path d="M20 3l6 17h-12z" fill="#e9564a"/><path d="M20 37l-6-17h12z" fill="currentColor"/></svg></button>
  <button id="orbit" title="Girar alrededor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
  <button id="sun" title="Sombras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</div>
<div id="hint">Arrastra para moverte · clic derecho o Ctrl + arrastrar para pivotear · rueda para acercar</div>
<div id="warn"></div>
<nav id="menu"></nav>
<div id="cards"></div>
<div id="loader"><div class="box"><b>Hotel La Fontana</b><div class="track"><div class="fill" id="fill"></div></div><small id="pct">Preparando escena</small></div></div>

<script>
(async () => {
  const C = Cesium, cfg = window.TLF_CONFIG || {};
  const step = (p, t) => { document.getElementById('fill').style.width = p + '%'; document.getElementById('pct').textContent = t; };
  const geo = await (await fetch('geo.json')).json();
  const google = !!(cfg.googleMapsKey || cfg.cesiumIonToken);
  if (cfg.cesiumIonToken) C.Ion.defaultAccessToken = cfg.cesiumIonToken;

  const viewer = new C.Viewer('map', {
    animation: false, timeline: false, baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
    navigationHelpButton: false, fullscreenButton: false, infoBox: false, selectionIndicator: false,
    baseLayer: google ? false : new C.ImageryLayer(new C.OpenStreetMapImageryProvider({url: 'https://tile.openstreetmap.org/', maximumLevel: 19})),
    msaaSamples: 4, shadows: true, terrainShadows: C.ShadowMode.RECEIVE_ONLY,
  });
  const scene = viewer.scene;
  scene.globe.show = !google;
  scene.highDynamicRange = true;
  scene.postProcessStages.tonemapper = C.Tonemapper.PBR_NEUTRAL;
  scene.postProcessStages.exposure = 1.3;
  scene.postProcessStages.fxaa.enabled = true;
  // bruma atmosferica clara, como la referencia
  scene.skyAtmosphere.show = true;
  scene.skyAtmosphere.hueShift = -0.02; scene.skyAtmosphere.saturationShift = -0.25; scene.skyAtmosphere.brightnessShift = 0.15;
  scene.atmosphere.lightIntensity = 12; scene.atmosphere.brightnessShift = 0.08;
  scene.fog.enabled = true; scene.fog.density = 2.4e-4; scene.fog.minimumBrightness = 0.6;
  scene.light = new C.SunLight({intensity: 3.2});
  viewer.clock.currentTime = C.JulianDate.fromIso8601('2026-11-06T15:30:00Z'); // 10:30 a.m. Bogota
  viewer.clock.shouldAnimate = true; viewer.clock.multiplier = 0;
  const sm = viewer.shadowMap; sm.size = 4096; sm.softShadows = true; sm.darkness = 0.32; sm.maximumDistance = 2500;
  const ctl = scene.screenSpaceCameraController;
  ctl.minimumZoomDistance = 4; ctl.maximumZoomDistance = 12000; ctl.enableCollisionDetection = true;

  // georreferencia: origen local EPSG:9377 (4884540, 2077660), z = 2549 msnm -> elipsoide (+ geoide)
  const h = google ? geo.h : 0;
  const M = C.Transforms.eastNorthUpToFixedFrame(C.Cartesian3.fromDegrees(geo.lon, geo.lat, h));
  C.Matrix4.multiply(M, C.Matrix4.fromRotationTranslation(C.Matrix3.fromRotationZ(C.Math.toRadians(geo.rot_deg))), M);
  C.Matrix4.multiplyByUniformScale(M, geo.scale, M);

  step(10, 'Ciudad');
  let tiles = null, clip = null;
  if (google) {
    try {
      tiles = cfg.googleMapsKey
        ? await C.createGooglePhotorealistic3DTileset({key: cfg.googleMapsKey}, {maximumScreenSpaceError: 8})
        : await C.createGooglePhotorealistic3DTileset(undefined, {maximumScreenSpaceError: 8});
      tiles.shadows = C.ShadowMode.RECEIVE_ONLY;
      clip = new C.ClippingPolygonCollection({polygons: [new C.ClippingPolygon({positions: C.Cartesian3.fromDegreesArray(geo.clip.flat())})]});
      tiles.clippingPolygons = clip;
      scene.primitives.add(tiles);
    } catch (e) { console.error(e); warn('No se pudo cargar la ciudad fotorrealista (revisa la llave en config.js).'); scene.globe.show = true; }
  } else warn('Falta la llave de Google 3D en config.js: el entorno se muestra sobre un mapa plano.');

  step(30, 'Edificios, vías y terreno');
  const load = (url, p, t) => C.Model.fromGltfAsync({url, modelMatrix: M, shadows: C.ShadowMode.ENABLED})
    .then(m => { scene.primitives.add(m); step(p, t); return m; });
  const [ciudad, arboles] = await Promise.all([load('modelo/ciudad.glb', 75, 'Árboles'), load('modelo/arboles.glb', 90, 'Listo')]);
  arboles.shadows = C.ShadowMode.CAST_ONLY;

  // contexto: nuestro modelo (Google recortado) o ciudad real completa
  document.querySelectorAll('#ctx button').forEach(b => b.onclick = () => {
    if (b.dataset.c === 'real' && !tiles) { warn('La ciudad real necesita la llave de Google 3D en config.js.'); return; }
    document.querySelectorAll('#ctx button').forEach(x => x.classList.toggle('on', x === b));
    const real = b.dataset.c === 'real';
    ciudad.show = arboles.show = !real;
    if (tiles) clip.enabled = !real;
  });

  // ---------- lugares
  const hotelLL = geo.hotel, uniLL = [-74.04145, 4.70208];
  const places = [
    {label: 'Hotel La Fontana', sub: 'ESTELAR', ll: hotelLL, up: 45, main: true},
    {label: 'Unicentro', ll: uniLL, up: 30},
    {label: 'Usaquén', ll: [-74.0307, 4.6949], up: 20},
    {label: 'Parque de la 93', ll: [-74.0483, 4.6765], up: 20},
    {label: 'Cerros Orientales', ll: [-74.0180, 4.7020], up: 300},
  ];
  const pinsEl = document.getElementById('pins');
  places.forEach(p => {
    p.pos = C.Cartesian3.fromDegrees(p.ll[0], p.ll[1], h + p.up);
    p.el = document.createElement('div'); p.el.className = 'pin' + (p.main ? ' main' : '');
    p.el.innerHTML = p.main ? `<span><b>${p.label}</b><em>${p.sub}</em></span><i></i>` : `<span>${p.label}</span><i></i>`;
    pinsEl.appendChild(p.el);
  });
  const tmp = new C.Cartesian2(), occ = new C.EllipsoidalOccluder(C.Ellipsoid.WGS84, C.Cartesian3.ZERO);
  scene.postRender.addEventListener(() => {
    const cam = scene.camera.positionWC; occ.cameraPosition = cam;
    places.forEach(p => {
      const s = C.SceneTransforms.worldToWindowCoordinates(scene, p.pos, tmp);
      const d = C.Cartesian3.distance(cam, p.pos);
      const vis = s && occ.isPointVisible(p.pos) && d < (p.main ? 20000 : 9000) && d > 60;
      p.el.style.opacity = vis ? 1 : 0;
      if (s) { p.el.style.left = s.x + 'px'; p.el.style.top = s.y + 'px'; }
    });
    document.querySelector('#compass svg').style.transform = `rotate(${-C.Math.toDegrees(scene.camera.heading)}deg)`;
  });

  // tarjetas: distancia real en linea recta desde el hotel
  const geod = new C.EllipsoidGeodesic();
  const dist = ll => { geod.setEndPoints(C.Cartographic.fromDegrees(...hotelLL), C.Cartographic.fromDegrees(...ll)); return geod.surfaceDistance; };
  document.getElementById('cards').innerHTML = places.filter(p => !p.main && p.up < 100).map(p => {
    const m = dist(p.ll); const v = m < 1000 ? [Math.round(m / 10) * 10, 'metros'] : [(m / 1000).toFixed(1).replace('.', ','), 'km'];
    return `<div class="c"><small>${p.label}</small><div><b>${v[0]}</b><span>${v[1]}</span></div></div>`;
  }).join('');

  // ---------- vistas (menu)
  const at = (ll, up = 0) => C.Cartesian3.fromDegrees(ll[0], ll[1], h + up);
  const views = [
    {label: 'Ubicación', target: at([-74.0400, 4.6930]), heading: 345, pitch: -24, range: 5200},
    {label: 'Master plan', target: at([geo.lon - 0.001, geo.lat + 0.001]), heading: 20, pitch: -55, range: 2300},
    {label: 'Hotel La Fontana', target: at(hotelLL, 12), heading: 215, pitch: -30, range: 380},
    {label: 'Fachada Calle 127', target: at(hotelLL, 10), heading: 180, pitch: -10, range: 170},
    {label: 'Unicentro', target: at(uniLL, 8), heading: 330, pitch: -35, range: 650},
  ];
  const menu = document.getElementById('menu');
  function go(i, dur = 2.4) {
    stopOrbit();
    [...menu.children].forEach((b, k) => b.classList.toggle('on', k === i));
    const v = views[i];
    viewer.camera.flyToBoundingSphere(new C.BoundingSphere(v.target, 1), {duration: dur,
      offset: new C.HeadingPitchRange(C.Math.toRadians(v.heading), C.Math.toRadians(v.pitch), v.range)});
  }
  views.forEach((v, i) => { const b = document.createElement('button'); b.textContent = v.label; b.onclick = () => go(i); menu.appendChild(b); });

  // ---------- orbita (pivote sobre el centro de la pantalla)
  let orbiting = false, orbitFn = null;
  function stopOrbit() {
    if (!orbiting) return; orbiting = false; document.getElementById('orbit').classList.remove('on');
    viewer.clock.onTick.removeEventListener(orbitFn); viewer.camera.lookAtTransform(C.Matrix4.IDENTITY);
  }
  function center() {
    const c = new C.Cartesian2(viewer.canvas.clientWidth / 2, viewer.canvas.clientHeight / 2);
    const p = scene.pickPositionSupported ? scene.pickPosition(c) : undefined;
    return p && C.defined(p) ? p : at(hotelLL, 12);
  }
  function startOrbit() {
    const cam = viewer.camera, tgt = center();
    const range = Math.max(120, Math.min(6000, C.Cartesian3.distance(cam.positionWC, tgt)));
    let hd = cam.heading; const pt = Math.min(-0.12, cam.pitch); let last = performance.now();
    orbiting = true; document.getElementById('orbit').classList.add('on');
    orbitFn = () => { const now = performance.now(); hd += (now - last) * 0.00005; last = now; cam.lookAt(tgt, new C.HeadingPitchRange(hd, pt, range)); };
    viewer.clock.onTick.addEventListener(orbitFn);
  }
  document.getElementById('orbit').onclick = () => orbiting ? stopOrbit() : startOrbit();
  ['pointerdown', 'wheel'].forEach(ev => viewer.canvas.addEventListener(ev, () => { stopOrbit(); document.getElementById('hint').style.opacity = 0; }, {passive: true}));
  document.getElementById('compass').onclick = () => {
    const tgt = center(); const r = C.Cartesian3.distance(viewer.camera.positionWC, tgt);
    viewer.camera.flyToBoundingSphere(new C.BoundingSphere(tgt, 1), {duration: 1, offset: new C.HeadingPitchRange(0, viewer.camera.pitch, r)});
  };
  const sunBtn = document.getElementById('sun'); sunBtn.classList.add('on');
  sunBtn.onclick = () => { viewer.shadows = !viewer.shadows; sunBtn.classList.toggle('on', viewer.shadows); };
  if (Math.min(innerWidth, innerHeight) < 700) { viewer.shadows = false; sunBtn.classList.remove('on'); }

  function warn(t) { const w = document.getElementById('warn'); w.textContent = t; w.style.display = 'block'; }

  // como la referencia: ciudad fotorrealista por defecto cuando hay llave
  if (tiles) document.querySelector('#ctx button[data-c="real"]').click();
  go(2, 0);
  step(100, 'Listo');
  const L = document.getElementById('loader'); setTimeout(() => { L.style.opacity = 0; setTimeout(() => L.remove(), 800); }, 600);
  setTimeout(startOrbit, 1500);
  window.viewer = viewer;
})();
</script>
</body>
</html>
